name: Feature Request
description: 提出一个新功能建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 请清晰简洁地描述您想要的功能
      placeholder: 我希望添加...
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请描述这个功能在什么场景下会用到
      placeholder: |
        作为一个用户，我希望...以便于...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望解决方案
      description: 请描述您期望的解决方案或实现方式
      placeholder: 可以通过...实现...

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 请描述您考虑过的替代方案
      placeholder: 我也考虑过...

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 添加任何其他关于功能请求的信息
      placeholder: 其他相关信息...
