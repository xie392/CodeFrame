# Dependabot 配置
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # npm/pnpm 依赖
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "xie392"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    # 分组更新
    groups:
      # 开发依赖分组
      dev-dependencies:
        patterns:
          - "@types/*"
          - "@testing-library/*"
          - "eslint*"
          - "prettier"
        update-types:
          - "minor"
          - "patch"
      # React 相关分组
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
    # 忽略某些更新
    ignore:
      # 避免破坏性更新
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "github-actions"
      - "dependencies"
    commit-message:
      prefix: "ci"
